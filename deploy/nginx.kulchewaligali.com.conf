# Nginx reverse proxy for kulchewaligali.com -> Node backend on 127.0.0.1:5000
# The Node app serves the frontend, /admin and /api, so proxy everything.
# After placing this in /etc/nginx/sites-available/ and symlinking to sites-enabled/,
# run: certbot --nginx -d kulchewaligali.com -d www.kulchewaligali.com
server {
    listen 80;
    server_name kulchewaligali.com www.kulchewaligali.com;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # lets secure cookies work over HTTPS
        proxy_read_timeout 60s;
    }
}
# certbot will add the TLS (443) server block automatically.
