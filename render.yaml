# Render.com blueprint — deploys the all-in-one Node app.
# IMPORTANT: Render's default disk is EPHEMERAL. Attach a persistent disk (below)
# so the SQLite database survives restarts/deploys, OR set DATABASE_URL to a
# managed PostgreSQL instance instead.
services:
  - type: web
    name: kulche-wali-gali
    runtime: node
    plan: starter            # a paid plan is required for a persistent disk
    branch: main
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    healthCheckPath: /api/health
    disk:
      name: kwg-data
      mountPath: /app/backend/database   # keeps franchise.sqlite persistent
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: SQLITE_STORAGE
        value: ./database/franchise.sqlite
      - key: CORS_ORIGIN
        value: https://kulchewaligali.com,https://www.kulchewaligali.com
      - key: SMTP_HOST
        value: smtp.hostinger.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: contact@pinkspoonfood.com
      - key: SMTP_PASS
        sync: false            # set this secret in the Render dashboard
      - key: MAIL_FROM
        value: Kulche Wali Gali <contact@pinkspoonfood.com>
      - key: MAIL_TO
        value: contact@pinkspoonfood.com
      - key: ADMIN_DEFAULT_USERNAME
        value: admin
      - key: ADMIN_DEFAULT_PASSWORD
        value: ChangeMe@123
